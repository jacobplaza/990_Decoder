name: Build 990 Decoder (PyInstaller)

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set PYTHONPATH
        shell: bash
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m PyInstaller \
              --clean \
              --noconfirm \
              --windowed \
              --onedir \
              --paths "$GITHUB_WORKSPACE" \
              --name 990_Decoder \
              --osx-bundle-identifier com.jacobplaza.decoder990 \
              gui/gui_runner.py
          else
            python -m PyInstaller \
              --clean \
              --noconfirm \
              --onefile \
              --noconsole \
              --paths "$GITHUB_WORKSPACE" \
              --name 990_Decoder \
              gui/gui_runner.py
          fi

      - name: Verify macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Architecture:"
          file dist/990_Decoder.app/Contents/MacOS/990_Decoder

          echo "Code signature:"
          codesign --verify --deep --strict --verbose=2 dist/990_Decoder.app

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p release

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/990_Decoder.exe release/990_Decoder-windows.exe

          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k --sequesterRsrc --keepParent \
              dist/990_Decoder.app \
              release/990_Decoder-macos.zip

          else
            mv dist/990_Decoder release/990_Decoder-linux
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
